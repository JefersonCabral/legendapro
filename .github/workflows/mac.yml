# Motor do LegendaPRO para Mac: monta o LegendaPRO.app/.dmg (chip Apple e Intel) e roda o teste de ponta
# a ponta (enviar vídeo, transcrever, recortar a pessoa, exportar MP4 e MOV) numa máquina Mac do GitHub.
# Em tag v* (ex.: v1.0.0), os .dmg vão para a página de Releases.
#
# Observação: as máquinas Mac do GitHub são virtuais e não têm a GPU (Metal) liberada, então lá a
# transcrição cai no processador; a do chip Apple (MLX) só roda de verdade num Mac de verdade.
name: Motor Mac

on:
  push:
    branches: [main]
    paths: ["versao-instalavel/**", ".github/workflows/mac.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # anexar os .dmg na Release (só em tag)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    # o Mac Intel é secundário: se a máquina Intel do GitHub não estiver disponível, não trava o resto
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || V="$(python3 -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('versao-instalavel/app/legendapro/__init__.py').read()).group(1))")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache dos downloads (Python, ffmpeg)
        uses: actions/cache@v4
        with:
          path: versao-instalavel/build/cache-mac
          key: mac-${{ matrix.arch }}-${{ hashFiles('versao-instalavel/build/mac/build_mac.sh') }}

      - name: Montar LegendaPRO.app e .dmg
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash versao-instalavel/build/mac/build_mac.sh ${{ matrix.arch }} ${{ steps.v.outputs.version }}

      - name: Teste de ponta a ponta
        run: |
          RES=versao-instalavel/dist-mac/LegendaPRO.app/Contents/Resources
          "$RES/python/bin/python3" versao-instalavel/build/ci_smoke.py \
            --python "$RES/python/bin/python3" --app "$RES/app" --model tiny

      - name: Teste sem aceleração (caminho de reserva no processador)
        env:
          LEGENDAPRO_FORCE_CPU: "1"
        run: |
          RES=versao-instalavel/dist-mac/LegendaPRO.app/Contents/Resources
          "$RES/python/bin/python3" versao-instalavel/build/ci_smoke.py \
            --python "$RES/python/bin/python3" --app "$RES/app" --model tiny --port 7890

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaPRO-mac-${{ matrix.arch }}
          path: versao-instalavel/dist-mac/LegendaPRO-mac-${{ matrix.arch }}.dmg
          retention-days: 30

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: versao-instalavel/dist-mac/LegendaPRO-mac-${{ matrix.arch }}.dmg
